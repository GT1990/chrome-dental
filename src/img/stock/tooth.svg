<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="heroCircleGradient" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#9fd2ff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#58a3f6" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1c57d7" stop-opacity="0.98" />
    </radialGradient>
    <radialGradient id="heroCircleHighlight" cx="38%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="heroCircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feOffset in="blur" dx="0" dy="28" result="offsetBlur" />
      <feColorMatrix
        in="offsetBlur"
        type="matrix"
        values="0 0 0 0 0.027  0 0 0 0 0.145  0 0 0 0 0.376  0 0 0 0.38 0"
        result="shadow"
      />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#heroCircleShadow)">
    <circle cx="320" cy="320" r="268" fill="url(#heroCircleGradient)" />
    <circle cx="292" cy="244" r="186" fill="url(#heroCircleHighlight)" />
  </g>
</svg>
